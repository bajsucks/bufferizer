name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Run Selene
        id: selene
        run: selene src